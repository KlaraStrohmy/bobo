" font-family="Arial Rounded MT Bold, Avenir Next, Helvetica Neue, Arial" font-size="29" font-weight="500" fill="#2b1f3f"  >Zapni „Připomínat hlasování“</text><text x="648" y="846" font-family="Avenir Next, Helvetica Neue, Arial" font-size="25" font-weight="500" fill="#6b5e82"  >V pondělí dopoledne přijde</text><text x="648" y="878" font-family="Avenir Next, Helvetica Neue, Arial" font-size="25" font-weight="500" fill="#6b5e82"  >„Hlasuj!“, když jsi ještě nehlasoval.</text><path d="M496 1109 C 536 1109, 540 980, 572 980" fill="none" stroke="#6b3fd4" stroke-width="4" stroke-linecap="round"/><g><circle cx="600" cy="980" r="27" fill="#6b3fd4" stroke="#2b1f3f" stroke-width="4"/><text x="600" y="991" font-family="Arial Rounded MT Bold, Avenir Next, Helvetica Neue, Arial" font-size="32" font-weight="500" fill="#fff" text-anchor="middle" >5</text></g><text x="648" y="978" font-family="Arial Rounded MT Bold, Avenir Next, Helvetica Neue, Arial" font-size="29" font-weight="500" fill="#2b1f3f"  >Klepni na „Povolit notifikace“</text><text x="648" y="1016" font-family="Avenir Next, Helvetica Neue, Arial" font-size="25" font-weight="500" fill="#6b5e82"  >Telefon se zeptá, potvrď „Povolit“.</text><text x="648" y="1048" font-family="Avenir Next, Helvetica Neue, Arial" font-size="25" font-weight="500" fill="#6b5e82"  >Zapíná se zvlášť na každém</text><text x="648" y="1080" font-family="Avenir Next, Helvetica Neue, Arial" font-size="25" font-weight="500" fill="#6b5e82"  >zařízení (telefon, počítač).</text><rect x="570" y="1130" width="470" height="190" rx="30" fill="#fff" stroke="#2b1f3f" stroke-width="4"/><text x="600" y="1178" font-family="Arial Rounded MT Bold, Avenir Next, Helvetica Neue, Arial" font-size="30" font-weight="500" fill="#6b3fd4"  >iPhone: důležité</text><text x="600" y="1214" font-family="Avenir Next, Helvetica Neue, Arial" font-size="24" font-weight="500" fill="#2b1f3f"  >Notifikace fungují jen v aplikaci</text><text x="600" y="1244" font-family="Avenir Next, Helvetica Neue, Arial" font-size="24" font-weight="500" fill="#2b1f3f"  >přidané na plochu (iOS 16.4+).</text><text x="600" y="1274" font-family="Avenir Next, Helvetica Neue, Arial" font-size="24" font-weight="500" fill="#2b1f3f"  >Otevírej Bobo z ikonky na ploše,</text><text x="600" y="1304" font-family="Avenir Next, Helvetica Neue, Arial" font-size="24" font-weight="500" fill="#2b1f3f"  >ne ze Safari.</text><rect x="40" y="1380" width="1000" height="220" rx="40" fill="#ece4fb" stroke="#2b1f3f" stroke-width="4"/><text x="80" y="1442" font-family="Avenir Next, Helvetica Neue, Arial" font-size="27" font-weight="600" fill="#2b1f3f"  >Připomínka se ptá na zítřek, jestli se vaří a ještě jsi neodpověděla.</text><text x="80" y="1480" font-family="Avenir Next, Helvetica Neue, Arial" font-size="27" font-weight="600" fill="#2b1f3f"  >Odpovědět jde rovnou z notifikace, aplikace se otevírat nemusí.</text><text x="80" y="1548" font-family="Arial Rounded MT Bold, Avenir Next, Helvetica Neue, Arial" font-size="40" font-weight="500" fill="#6b3fd4"  >bobo-worker.workers.dev</text><text x="80" y="1580" font-family="Avenir Next, Helvetica Neue, Arial" font-size="25" font-weight="500" fill="#6b5e82"  >https://bobo.bobo-worker.workers.dev</text></svg>