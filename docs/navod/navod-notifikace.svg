  >Povol je, ať ti připomínka dorazí.</text><rect x="124" y="1074" width="362" height="70" rx="35" fill="#6b3fd4" stroke="#2b1f3f" stroke-width="4"/><rect x="124" y="1145" width="362" height="6" rx="3" fill="#2b1f3f"/><text x="305" y="1119" font-family="Arial Rounded MT Bold, Avenir Next, Helvetica Neue, Arial" font-size="29" font-weight="500" fill="#fff" text-anchor="middle" >Povolit notifikace</text><rect x="374" y="306" width="68" height="68" rx="34" fill="none" stroke="#6b3fd4" stroke-width="5" stroke-dasharray="14 9"/><rect x="412" y="524" width="86" height="56" rx="26" fill="none" stroke="#6b3fd4" stroke-width="5" stroke-dasharray="14 9"/><rect x="394" y="606" width="106" height="64" rx="20" fill="none" stroke="#6b3fd4" stroke-width="5" stroke-dasharray="14 9"/><rect x="412" y="786" width="86" height="56" rx="26" fill="none" stroke="#6b3fd4" stroke-width="5" stroke-dasharray="14 9"/><rect x="114" y="1064" width="382" height="90" rx="44" fill="none" stroke="#6b3fd4" stroke-width="5" stroke-dasharray="14 9"/><path d="M430 314 C 470 314, 540 300, 572 300" fill="none" stroke="#6b3fd4" stroke-width="4" stroke-linecap="round"/><g><circle cx="600" cy="300" r="27" fill="#6b3fd4" stroke="#2b1f3f" stroke-width="4"/><text x="600" y="311" font-family="Arial Rounded MT Bold, Avenir Next, Helvetica Neue, Arial" font-size="32" font-weight="500" fill="#fff" text-anchor="middle" >1</text></g><text x="648" y="298" font-family="Arial Rounded MT Bold, Avenir Next, Helvetica Neue, Arial" font-size="29" font-weight="500" fill="#2b1f3f"  >Klepni na ikonku nastavení</text><text x="648" y="336" font-family="Avenir Next, Helvetica Neue, Arial" font-size="25" font-weight="500" fill="#6b5e82"  >Tři posuvníky vpravo nahoře</text><text x="648" y="368" font-family="Avenir Next, Helvetica Neue, Arial" font-size="25" font-weight="500" fill="#6b5e82"  >v horní liště aplikace.</text><path d="M498 552 C 538 552, 540 470, 572 470" fill="none" stroke="#6b3fd4" stroke-width="4" stroke-linecap="roun